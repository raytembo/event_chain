name: Build & Release EventChain APK

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v1.2.3

jobs:
  build:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Android toolchain) ───────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter 3.22 ───────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # ── 4. NDK (required to compile the C++ cryptographic core via CMake) ────
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      # ── 5. Install Dart/Flutter dependencies ─────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 6. (Optional) Run unit & widget tests ────────────────────────────────
      # Uncomment to gate releases on a passing test suite.
      - name: Run tests
        run: flutter test

      # ── 7. Build release APK ─────────────────────────────────────────────────
      # flutter build apk compiles the Dart code AND the C++ native library
      # (libeventchain.so) via CMake/NDK for armeabi-v7a and arm64-v8a.
      - name: Build release APK
        run: flutter build apk --release

      # ── 8. Rename APK to include the version tag ──────────────────────────────
      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME}
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/eventchain-${VERSION}.apk

      # ── 9. Create GitHub Release and attach APK ───────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EventChain ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🎟️ EventChain ${{ github.ref_name }}

            Secure event ticketing using DCT-QIM steganography, Fibonacci XOR encryption, and a private proof-of-work blockchain.

            ### Device Requirements
            - Android 6.0 (API 23) or higher
            - ARMv8-A processor (physical device or ARM emulator)
            - Minimum 2 GB RAM
            - Camera access for gate verification

            ### Installation
            1. Download **eventchain-${{ github.ref_name }}.apk** below.
            2. On your Android device, go to **Settings → Apps → Special app access → Install unknown apps** and allow installs from your browser or file manager.
            3. Open the downloaded APK and tap **Install**.

            > ⚠️ **Note:** x86 emulators are not supported. The native cryptographic library (`libeventchain.so`) requires an ARM device or ARM-based emulator.

            ---
            Built from tag `${{ github.ref_name }}` · Flutter 3.22 · Dart 3.4 · Android API 23+
          files: build/app/outputs/flutter-apk/eventchain-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}