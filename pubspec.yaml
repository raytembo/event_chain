name: eventchain
description: Secure Event Ticket Management with Blockchain + Steganography
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  ffi: ^2.1.0

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # ── Supabase (replaces Isar) ───────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # File system & paths
  path_provider: ^2.1.3
  path: ^1.9.0

  # Camera
  camera: ^0.10.5+9

  # Image I/O
  image: ^4.8.0
  image_picker: ^1.2.1
  file_picker: ^8.0.7
  

  # QR
  qr_flutter: ^4.1.0
  archive: ^4.0.9

  # Sharing / export
  share_plus: ^9.0.0

  # Permissions
  permission_handler: ^11.3.1

  # UI helpers
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  gap: ^3.0.1
  shimmer: ^3.0.0


  # Biometric authentication
  local_auth: ^2.1.8

  # Session persistence
  shared_preferences: ^2.2.3

  # UUID generation
  uuid: ^4.4.0

  # Timestamp formatting
  intl: ^0.19.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  gal: ^2.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  # build_runner        ← gone, nothing needs codegen anymore
  # riverpod_generator  ← gone
  # isar_community_generator ← gone

flutter_icons:
  android: true
  image_path: "assets/EventChainIcons/appstore.png"
  adaptive_icon_foreground: "assets/EventChainIcons/appstore.png"
  adaptive_icon_background: "#FF0A0A0A"

flutter:
  uses-material-design: true